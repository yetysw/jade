[project]
name = "jade"
version = "1.10.1"
description = "Jade — assistant documentaire local : indexation locale, retrieval local, generation via LLM central (Ollama/AI01)"
requires-python = ">=3.12"
dependencies = [
    "fastembed==0.8.0",
    "chromadb==1.5.9",
    "python-docx==1.2.0",
    "python-pptx>=1.0",
    "openpyxl==3.1.5",
    "xlrd>=2.0",
    "extract-msg>=0.48",
    "odfpy>=1.4",
    "pypdf==6.14.2",
    "pypdfium2>=4.30",
    "httpx==0.28.1",
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "rank-bm25>=0.2",
    "platformdirs>=4.0",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=8.0"]
# OCR local des scans/images (~125 Mo avec OpenCV) — exclu de l'exe léger ;
# l'application dégrade proprement sans (ocr.available() -> False).
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
jade = "ragagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragagent*"]
